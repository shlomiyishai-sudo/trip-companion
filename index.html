<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הטיולים שלנו</title>
<meta name="theme-color" content="#123A4A">
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="טיולים">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=25">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>
      <div class="trip-sub" id="tripSub"></div>
      <h1 id="tripTitle">טוען…</h1>
    </div>
    <div class="hdr-r"><div class="wx" id="wxNow" aria-live="polite"></div><button class="boardbtn" id="boardBtn" aria-label="לוח התכנון">🗂 לוח <span id="syncBadge"></span></button></div>
  </div>
  <nav class="days" id="dayChips" aria-label="ימי הטיול"></nav>
</header>

<main>
  <section id="view-today" class="view" aria-label="היום"></section>
  <section id="view-map" class="view" hidden aria-label="מפה">
    <div class="layer-bar" id="layerBar"></div>
    <div class="map-note" id="mapNote" hidden></div>
    <div id="map" class="map"></div>
  </section>
  <section id="view-places" class="view" hidden aria-label="מקומות"></section>
  <section id="view-docs" class="view" hidden aria-label="מסמכים"></section>
</main>

<div class="quick" id="quick" aria-label="פעולות מהירות"></div>

<nav class="tabs" aria-label="ניווט ראשי">
  <button data-view="today" class="on"><span class="ti">☀︎</span>היום</button>
  <button data-view="map"><span class="ti">⌖</span>מפה</button>
  <button data-view="places"><span class="ti">☰</span>מקומות</button>
  <button data-view="docs"><span class="ti">▤</span>מסמכים</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=25"></script>
<script src="data/budapest.js?v=25"></script>
<script src="data/plan.js?v=25"></script>
<script src="app.js?v=25"></script>
</body>
</html>
